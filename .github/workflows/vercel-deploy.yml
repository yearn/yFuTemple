name: Deploy to Vercel

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  id-token: write
  pull-requests: write

cache-mode: none

jobs:
  y-fu:
    uses: yearn/yearn-gha/.github/workflows/vercel-deploy.yml@a7fd41d380947b253040c578d97478b45f9a8c73
    with:
      project: y-fu
      identity-id: ${{ github.event_name == 'pull_request' && vars.DOPPLER_PREVIEW_IDENTITY_ID || vars.DOPPLER_PRODUCTION_IDENTITY_ID }}
